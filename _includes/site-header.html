<header class="site-header">
  <div class="site-header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="回到實驗室首頁">
      <span class="site-brand-mark">
        <img src="{{ '/assets/images/lab-sign.jpg' | relative_url }}" alt="" width="40" height="40">
      </span>
      <span class="site-brand-name">
        NFU <span>I.R.S.</span> LAB
      </span>
    </a>

    <nav class="desktop-nav" aria-label="主要導覽">
      <a class="site-nav-link {% if page.page_key == 'home' %}is-active{% endif %}" href="{{ '/' | relative_url }}">首頁</a>
      <a class="site-nav-link" href="https://github.com/NFU-Robotlab/nfu-robotlab-internal-docs" target="_blank" rel="noopener noreferrer">實驗室行政</a>

    </nav>

    <div class="header-actions">
      <button id="audio-toggle-btn" class="audio-toggle" type="button" aria-pressed="false" title="切換介面音效">
        <span id="audio-icon" aria-hidden="true">🔇</span>
        <span class="audio-label">音效關閉</span>
      </button>

      <details class="mobile-nav">
        <summary>選單</summary>
        <nav aria-label="行動版導覽">
          <a href="{{ '/' | relative_url }}">首頁</a>
          <a href="https://github.com/NFU-Robotlab/nfu-robotlab-internal-docs" target="_blank" rel="noopener noreferrer">實驗室行政</a>
          <a href="https://github.com/NFU-Robotlab/nfu-robotlab.github.io" target="_blank" rel="noopener noreferrer">GitHub</a>
        </nav>
      </details>
    </div>
  </div>
