<!doctype html>
<html lang="{{ site.lang | default: 'zh-TW' }}" class="scroll-smooth">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#eef3fb">
    <meta name="color-scheme" content="light">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">

    <title>{{ page.title | default: site.title }}</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_TW">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v=20260825-ios2">
    {% if page.page_css %}
      <link rel="stylesheet" href="{{ page.page_css | relative_url }}?v=20260825-ios2">
    {% endif %}
  </head>
  <body class="page-{{ page.page_key }} {{ page.body_class }}">
    <a class="skip-link" href="#main-content">跳至主要內容</a>
    {% include site-header.html %}

    <div id="main-content">
      {{ content }}
    </div>

    {% include site-footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}?v=20260825-ios2" defer></script>
    <script src="{{ '/assets/js/audio.js' | relative_url }}?v=20260825-ios2" defer></script>
    {% if page.page_js %}
      <script src="{{ page.page_js | relative_url }}?v=20260825-ios2" defer></script>
    {% endif %}
  </body>
</html>
